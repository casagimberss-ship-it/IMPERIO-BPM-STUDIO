name: Compilar IMPERIO BPM Studio APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-apk:
    name: Build APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: Compilar APK de depuración
        run: gradle --no-daemon :app:assembleDebug

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: IMPERIO-BPM-STUDIO-APK-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
